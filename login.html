<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Assistente de Viagem</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistente de Viagem">
<script>
(function(){
  try {
    var manifest = {
      name: "Assistente de Viagem",
      short_name: "Assistente de Viagem",
      start_url: window.location.href,
      scope: window.location.href,
      display: "standalone",
      background_color: "#22262B",
      theme_color: "#22262B",
      icons: [
        { src: window.location.href.replace(/login\.html$/, "") + "icons/icon-192.png", sizes: "192x192", type: "image/png" },
        { src: window.location.href.replace(/login\.html$/, "") + "icons/icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  } catch(e) { console.error('Falha ao montar manifest dinamico:', e); }
})();
</script>

<meta name="theme-color" content="#22262B">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Diário de despesas &middot; viagens a trabalho</span>
    <h1>Assistente de Viagem</h1>
    <p>Entre com sua conta Google para continuar.</p>
  </header>

  <div class="panel" style="text-align:center; padding:32px 16px;">
    <div id="google-signin-button" style="display:inline-block;"></div>
    <div id="login-erro" style="display:none; margin-top:14px; color:var(--rust); font-family:'IBM Plex Mono',monospace; font-size:12px;"></div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="shared.js"></script>
<script src="login.js"></script>
</body>
</html>
