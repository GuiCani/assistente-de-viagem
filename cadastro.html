<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo — Assistente de Viagem</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistente de Viagem">
<script>
(function(){
  try {
    var manifest = {
      name: "Assistente de Viagem",
      short_name: "Assistente de Viagem",
      start_url: window.location.href,
      scope: window.location.href,
      display: "standalone",
      background_color: "#22262B",
      theme_color: "#22262B",
      icons: [
        { src: window.location.href.replace(/cadastro\.html$/, "") + "icons/icon-192.png", sizes: "192x192", type: "image/png" },
        { src: window.location.href.replace(/cadastro\.html$/, "") + "icons/icon-512.png", sizes: "512x512", type: "image/png" }
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  } catch(e) { console.error('Falha ao montar manifest dinamico:', e); }
})();
</script>

<meta name="theme-color" content="#22262B">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">Diário de despesas &middot; viagens a trabalho</span>
    <h1>Bem-vindo!</h1>
    <p>Só mais um passo antes de começar.</p>
  </header>

  <div class="panel">
    <h3>Seu nome</h3>
    <input id="nome-input" type="text" placeholder="Seu nome" style="width:100%; padding:8px 9px; border-radius:4px; border:1px solid #4A5058; background:#181B1F; color:var(--paper); font-size:13px;">

    <div id="migrar-area" style="margin-top:18px; display:none;">
      <p class="hint">Encontramos viagens salvas neste aparelho, de antes do login.</p>
      <button id="migrar-btn" class="btn btn-ghost" onclick="migrarDados()">Migrar meus dados existentes pra essa conta</button>
    </div>

    <div style="margin-top:22px;">
      <button class="btn btn-primary" onclick="continuar()">Continuar</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script src="cadastro.js"></script>
</body>
</html>
